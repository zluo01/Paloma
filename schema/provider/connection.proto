syntax = "proto3";

package paloma.provider.runtime.v1;

option java_package = "com.github.zluo01.paloma.proto.v1";
option java_multiple_files = true;

enum ProviderAuthMethod {
  PROVIDER_AUTH_METHOD_UNKNOWN = 0;
  PROVIDER_AUTH_METHOD_API_KEY = 1;
  PROVIDER_AUTH_METHOD_DEVICE_CODE = 2;
  PROVIDER_AUTH_METHOD_BROWSER_OAUTH = 3;
}

message ProviderAuth {
  oneof payload {
    string api_key = 1;
    string refresh_token = 2;
  }
}

message ConnectionPayload {
  oneof payload {
    DeviceCode device_code = 1;
    BrowserRedirect browser_redirect = 2;
    ManualInput manual_input = 3;
  }
}

message DeviceCode {
  string verification_url = 1;
  string user_code = 2;
  string transaction_payload = 3;
}

message BrowserRedirect {
  string authorization_url = 1;
}

message ManualInput {
  repeated Instruction instructions = 1;
}

message Instruction {
  oneof content {
    string text = 1;
    InstructionLink link = 2;
  }
}

message InstructionLink {
  string label = 1;
  string link = 2;
}

message InitConnectionRequest {}

message InitConnectionResponse {
  ConnectionPayload connection = 1;
}

message FinalizeConnectionRequest {
  oneof input {
    // device code auth passthrough data
    string transaction_payload = 1;
    // oauth callback data
    string authorization_response = 2;
    string api_key = 3;
  }
}

message FinalizeConnectionResponse {
  ProviderAuth auth = 1;
}

message CancelConnectionRequest {}

message CancelConnectionResponse {}
