syntax = "proto3";

package paloma.binding.v1;

message ProviderBackendId {
  string provider_id = 1;
  string backend_id = 2;
}

message ExtensionCapabilityId {
  string extension_id = 1;
  string capability_id = 2;
}

message Icon {
  oneof icon {
    string name = 1;
    string path = 2;
    bytes embedded = 3;
  }
}

enum HealthStatus {
  HEALTH_STATUS_STARTING = 0;
  HEALTH_STATUS_RUNNING = 1;
  HEALTH_STATUS_UNHEALTHY = 2;
}

enum HealthLevel {
  HEALTH_LEVEL_INACTIVE = 0;
  HEALTH_LEVEL_HEALTHY = 1;
  HEALTH_LEVEL_DOWN = 2;
  HEALTH_LEVEL_DEGRADED = 3;
}

enum PluginType {
  PLUGIN_TYPE_EXTENSION = 0;
  PLUGIN_TYPE_PROVIDER = 1;
  PLUGIN_TYPE_MCP = 2;
}

enum Transport {
  TRANSPORT_LOCAL = 0;
  TRANSPORT_HTTP = 1;
}

enum CapabilityFacet {
  CAPABILITY_FACET_SEARCH = 0;
  CAPABILITY_FACET_TOOL = 1;
  CAPABILITY_FACET_MCP = 2;
}

message LocalPluginArgs {
  string command = 1;
  repeated string args = 2;
}

message RemotePluginArgs {
  string url = 1;
  bool requires_auth = 2;
}

message Plugin {
  string name = 1;
  Transport transport = 2;
  uint32 timeout = 3;
  bool disabled = 4;
  map<string, string> env = 5;

  oneof args {
    LocalPluginArgs local = 6;
    RemotePluginArgs remote = 7;
  }
}

message FacetState {
  CapabilityFacet facet = 1;
  bool disabled = 2;
}

message CapabilityInfo {
  string id = 1;
  string description = 2;
  repeated FacetState facets = 3;
}
