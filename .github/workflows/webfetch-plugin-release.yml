name: WebFetch plugin release

on:
  push:
    tags:
      - "webfetch-plugin-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: bash .github/scripts/resolve-release.sh webfetch-plugin-v

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/extensions/webfetch/go.mod
          cache-dependency-path: plugins/extensions/webfetch/go.sum

      - name: Lint and test
        working-directory: plugins/extensions/webfetch
        run: |
          make lint
          make test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
          - name: windows-arm64
            runner: ubuntu-latest
            goos: windows
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/extensions/webfetch/go.mod
          cache-dependency-path: plugins/extensions/webfetch/go.sum

      - name: Build release binary
        working-directory: plugins/extensions/webfetch
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make release

      - name: Package release artifact
        working-directory: plugins/extensions/webfetch
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv webfetch webfetch.exe
            zip "webfetch-${{ matrix.name }}.zip" webfetch.exe
          else
            tar -czf "webfetch-${{ matrix.name }}.tar.gz" webfetch
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: webfetch-${{ matrix.name }}
          path: plugins/extensions/webfetch/webfetch-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: webfetch-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum webfetch-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.test.outputs.tag }}"
          version="${{ needs.test.outputs.version }}"
          release_target=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_target=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" dist/* \
            --latest=false \
            --notes "WebFetch extension plugin v${version}." \
            --title "WebFetch plugin v${version}" \
            "${release_target[@]}"
