name: WebFetch plugin

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/webfetch-plugin.yml"
      - "plugins/extensions/webfetch/**"
      - "schema/extension/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/webfetch-plugin.yml"
      - "plugins/extensions/webfetch/**"
      - "schema/extension/**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: plugins/extensions/webfetch/go.mod
          cache-dependency-path: plugins/extensions/webfetch/go.sum

      - name: Check generated protocol bindings
        working-directory: plugins/extensions/webfetch
        run: |
          make proto
          changes="$(git status --porcelain -- internal/pb)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Lint, test, and build
        working-directory: plugins/extensions/webfetch
        run: |
          make lint
          make test
          make release
