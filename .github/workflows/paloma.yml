name: Paloma

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "LICENSES/**"
      - ".github/workflows/bedrock-plugin.yml"
      - ".github/workflows/bedrock-plugin-release.yml"
      - ".github/workflows/deepseek-plugin.yml"
      - ".github/workflows/deepseek-plugin-release.yml"
      - ".github/workflows/webfetch-plugin.yml"
      - ".github/workflows/webfetch-plugin-release.yml"
      - "plugins/extensions/webfetch/**"
      - "plugins/providers/bedrock/**"
      - "plugins/providers/deepseek/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "LICENSES/**"
      - ".github/workflows/bedrock-plugin.yml"
      - ".github/workflows/bedrock-plugin-release.yml"
      - ".github/workflows/deepseek-plugin.yml"
      - ".github/workflows/deepseek-plugin-release.yml"
      - ".github/workflows/webfetch-plugin.yml"
      - ".github/workflows/webfetch-plugin-release.yml"
      - "plugins/extensions/webfetch/**"
      - "plugins/providers/bedrock/**"
      - "plugins/providers/deepseek/**"

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: "true"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            platform: linux
            runner: ubuntu-26.04
          - name: macOS
            platform: macos
            runner: macos-latest
            targets: aarch64-apple-darwin
          - name: Windows
            platform: windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --yes \
            libadwaita-1-dev \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.targets }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nightly Rust
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting, lint, and test
        if: matrix.platform == 'linux'
        run: |
          cargo +nightly fmt --all -- --check
          cargo +1.98.1 clippy --workspace --exclude paloma-provider-bedrock --all-targets --locked -- -D warnings
          cargo +1.98.1 test --workspace --exclude paloma-provider-bedrock --locked

      - name: Lint and test
        if: matrix.platform != 'linux'
        run: |
          cargo clippy --workspace --exclude paloma-provider-bedrock --all-targets --locked -- -D warnings
          cargo test --workspace --exclude paloma-provider-bedrock --locked

      - name: Generate Swift bindings
        if: matrix.platform == 'macos'
        run: scripts/build-swift-bindings.sh --debug

      - name: Build macOS application
        if: matrix.platform == 'macos'
        working-directory: gui/macos/Paloma
        run: xcodebuild -scheme Paloma CODE_SIGNING_ALLOWED=NO build

      - name: Install .NET 10
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet cache
        if: matrix.platform == 'windows'
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('gui/windows/**/*.csproj') }}
          restore-keys: nuget-windows-

      - name: Build and test Windows application
        if: matrix.platform == 'windows'
        run: dotnet test gui/windows/Paloma.Tests/Paloma.Tests.csproj -p:PalomaBindingsArgs=-Debug

      - name: Save NuGet cache
        if: matrix.platform == 'windows' && github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('gui/windows/**/*.csproj') }}
