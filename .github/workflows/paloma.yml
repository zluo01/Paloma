name: Paloma

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "LICENSES/**"
      - ".github/workflows/deepseek-plugin.yml"
      - ".github/workflows/deepseek-plugin-release.yml"
      - ".github/workflows/webfetch-plugin.yml"
      - ".github/workflows/webfetch-plugin-release.yml"
      - "plugins/extensions/webfetch/**"
      - "plugins/providers/deepseek/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "LICENSES/**"
      - ".github/workflows/deepseek-plugin.yml"
      - ".github/workflows/deepseek-plugin-release.yml"
      - ".github/workflows/webfetch-plugin.yml"
      - ".github/workflows/webfetch-plugin-release.yml"
      - "plugins/extensions/webfetch/**"
      - "plugins/providers/deepseek/**"

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: "true"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            platform: linux
            runner: ubuntu-26.04
          - name: macOS
            platform: macos
            runner: macos-latest
          - name: Windows
            platform: windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --yes \
            libadwaita-1-dev \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            pkg-config

      - name: Install Rust 1.94
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - name: Install Rust 1.94
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-apple-darwin

      - name: Install Rust 1.94
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nightly Rust
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting, lint, and test
        if: matrix.platform == 'linux'
        run: |
          cargo +nightly fmt --all -- --check
          cargo +1.94.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.94.0 test --workspace --locked

      # Windows PowerShell cold start on a fresh runner exceeds the permission
      # parser's sidecar timeout; pay it once before the test suite spawns it.
      - name: Warm up Windows PowerShell
        if: matrix.platform == 'windows'
        run: powershell.exe -NoProfile -NonInteractive -Command exit

      - name: Run Rust tests
        if: matrix.platform != 'linux'
        run: cargo test --workspace --locked

      - name: Generate Swift bindings
        if: matrix.platform == 'macos'
        run: scripts/build-swift-bindings.sh --debug

      - name: Build macOS application
        if: matrix.platform == 'macos'
        working-directory: gui/macos/Paloma
        run: xcodebuild -scheme Paloma CODE_SIGNING_ALLOWED=NO build

      - name: Install .NET 10
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test Windows application
        if: matrix.platform == 'windows'
        run: dotnet test gui/windows/Paloma.Tests/Paloma.Tests.csproj
