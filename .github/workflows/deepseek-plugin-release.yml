name: DeepSeek plugin release

on:
  push:
    tags:
      - "deepseek-plugin-v*"
  workflow_dispatch:
    inputs:
      date_suffix:
        description: Append the UTC date to the version (model catalogue update)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: plugins/providers/deepseek/pom.xml

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_SUFFIX: ${{ inputs.date_suffix }}
        run: |
          version="$(mvn -q --batch-mode -f plugins/providers/deepseek/pom.xml \
            help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$DATE_SUFFIX" != "true" ]; then
            VERSION_INPUT="$version" bash .github/scripts/resolve-release.sh deepseek-plugin-v "$version"
            exit 0
          fi

          version="${version}.$(date -u +%Y%m%d)"
          tag="deepseek-plugin-v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: plugins/providers/deepseek
        run: mvn -q --batch-mode --update-snapshots verify

      - name: Prepare release artifact
        working-directory: plugins/providers/deepseek
        run: |
          cp target/deepseek-provider-fat.jar \
            "deepseek-provider-${{ steps.release.outputs.version }}.jar"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-provider-jar
          path: plugins/providers/deepseek/deepseek-provider-*.jar
          if-no-files-found: error
          retention-days: 1

  build-native:
    name: Build native ${{ matrix.name }}
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-amd64
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          version: "25.2.4"
          java-version: "25"
          distribution: 'graalvm-community'
          cache: maven

      - name: Build native image
        working-directory: plugins/providers/deepseek
        run: mvn --batch-mode --no-transfer-progress -Pnative -DskipTests package

      - name: Package release artifact
        working-directory: plugins/providers/deepseek
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/deepseek-provider.exe .
            7z a "deepseek-provider-${{ matrix.name }}.zip" deepseek-provider.exe
          else
            tar -czf "deepseek-provider-${{ matrix.name }}.tar.gz" -C target deepseek-provider
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-provider-${{ matrix.name }}
          path: plugins/providers/deepseek/deepseek-provider-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [ build-and-test, build-native ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deepseek-provider-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum deepseek-provider-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build-and-test.outputs.tag }}"
          version="${{ needs.build-and-test.outputs.version }}"
          release_target=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_target=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" dist/* \
            --latest=false \
            --notes "DeepSeek provider plugin v${version}." \
            --title "DeepSeek plugin v${version}" \
            "${release_target[@]}"
