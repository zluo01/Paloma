name: DeepSeek plugin release

on:
  push:
    tags:
      - "deepseek-plugin-v*"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: plugins/providers/deepseek/pom.xml

      - name: Build and test
        working-directory: plugins/providers/deepseek
        run: mvn -q --batch-mode --update-snapshots verify

      - name: Prepare release artifact
        working-directory: plugins/providers/deepseek
        run: |
          version="${GITHUB_REF_NAME#deepseek-plugin-v}"
          cp target/deepseek-provider-fat.jar "deepseek-provider-${version}.jar"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-provider
          path: plugins/providers/deepseek/deepseek-provider-*.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: deepseek-provider
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum deepseek-provider-*.jar > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#deepseek-plugin-}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --latest=false \
            --notes "DeepSeek provider plugin ${version}." \
            --title "DeepSeek plugin ${version}" \
            --verify-tag
