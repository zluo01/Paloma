name: Update DeepSeek models

on:
  schedule:
    # Weekly, Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-deepseek-models
  cancel-in-progress: false

env:
  MODELS_FILE: plugins/providers/deepseek/src/main/resources/models.json

jobs:
  update:
    name: Update catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Regenerate models.json
        run: python3 plugins/providers/deepseek/scripts/update-models.py

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- "$MODELS_FILE"; then
            echo "No changes to $MODELS_FILE"
            exit 0
          fi
          
          gh api -X PUT "/repos/$GITHUB_REPOSITORY/contents/$MODELS_FILE" \
            -f message="update deepseek models." \
            -f branch="$GITHUB_REF_NAME" \
            -f sha="$(git rev-parse "HEAD:$MODELS_FILE")" \
            -f content="$(base64 -w0 "$MODELS_FILE")"
