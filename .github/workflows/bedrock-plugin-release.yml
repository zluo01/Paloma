name: Bedrock plugin release

on:
  push:
    tags:
      - "bedrock-plugin-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: bash .github/scripts/resolve-release.sh bedrock-plugin-v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bedrock-plugin

      - name: Lint and test
        run: |
          cargo clippy -p paloma-provider-bedrock --all-targets --locked -- -D warnings
          cargo test -p paloma-provider-bedrock --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: windows-amd64
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bedrock-plugin

      - name: Build release binary
        run: cargo build -p paloma-provider-bedrock --release --locked

      - name: Package release artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/bedrock-provider.exe .
            7z a "bedrock-provider-${{ matrix.name }}.zip" bedrock-provider.exe
          else
            tar -czf "bedrock-provider-${{ matrix.name }}.tar.gz" -C target/release bedrock-provider
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: bedrock-provider-${{ matrix.name }}
          path: bedrock-provider-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bedrock-provider-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum bedrock-provider-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.test.outputs.tag }}"
          version="${{ needs.test.outputs.version }}"
          release_target=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_target=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" dist/* \
            --latest=false \
            --notes "Amazon Bedrock provider plugin v${version}." \
            --title "Bedrock plugin v${version}" \
            "${release_target[@]}"
