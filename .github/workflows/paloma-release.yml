name: Paloma release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: "true"

jobs:
  build-mac:
    name: Build and test
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: bash .github/scripts/resolve-release.sh v

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Generate Swift bindings
        run: scripts/build-swift-bindings.sh

      - name: Build DMG
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/release-macos.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: paloma-macos
          path: target/macos/Paloma-*.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: bash .github/scripts/resolve-release.sh v

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('gui/windows/**/*.csproj') }}
          restore-keys: nuget-windows-

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build zip
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/release-windows.ps1

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: paloma-windows
          path: target/windows/Paloma-*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: paloma-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum Paloma-* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build-mac.outputs.tag }}"
          version="${{ needs.build-mac.outputs.version }}"
          release_target=(--verify-tag)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_target=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" dist/* \
            --latest \
            --notes "Paloma v${version}." \
            --title "Paloma v${version}" \
            "${release_target[@]}"
