name: Paloma release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_QUIET: "true"

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$workspace_version" ]; then
            echo "Tag version ${version} does not match workspace version ${workspace_version}."
            exit 1
          fi

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Generate Swift bindings
        run: scripts/build-swift-bindings.sh

      - name: Build DMG
        run: scripts/release-macos.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: paloma-macos
          path: target/macos/Paloma-*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: paloma-macos
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum Paloma-*.dmg > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --latest \
            --notes "Paloma ${GITHUB_REF_NAME}." \
            --title "Paloma ${GITHUB_REF_NAME}" \
            --verify-tag
