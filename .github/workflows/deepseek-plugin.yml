name: DeepSeek plugin

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deepseek-plugin.yml"
      - "plugins/providers/deepseek/**"
      - "schema/provider/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deepseek-plugin.yml"
      - "plugins/providers/deepseek/**"
      - "schema/provider/**"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: plugins/providers/deepseek/pom.xml

      - name: Verify plugin
        working-directory: plugins/providers/deepseek
        run: mvn -q --batch-mode --update-snapshots verify
