[package]
name = "uniffi-bindgen"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/swift.rs"

[target.'cfg(target_os = "macos")'.dependencies]
uniffi = { workspace = true, features = ["cli"] }
