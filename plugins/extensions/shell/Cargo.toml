[package]
name = "paloma-extension-shell"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
async-trait = { workspace = true }
dashmap = { workspace = true }
log = { workspace = true }
paloma-extension-base = { workspace = true }
paloma-extension-protocol = { workspace = true }
paloma-utils = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "sync",
    "rt-multi-thread",
    "time",
    "macros",
    "process",
] }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, default-features = false, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { workspace = true, default-features = false, features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
