[package]
name = "scry-gtk"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "GTK4/Linux frontend: overlay UI, settings, hotkey portal, and tray"

[dependencies]
gtk4 = { version = "0.11.3", features = ["v4_14"] }
gtk4-layer-shell = "0.8.0"
libadwaita = { version = "0.9.1", features = ["v1_9"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
futures = { workspace = true }
log = { workspace = true }
env_logger = "0.11.10"
ashpd = { version = "0.13.11", default-features = false, features = [
  "tokio",
  "global_shortcuts",
] }
ksni = { version = "0.3.5", default-features = false, features = ["tokio"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
uuid = { workspace = true }
scry-core = { path = "../scry-core" }
