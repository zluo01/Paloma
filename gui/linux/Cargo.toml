[package]
name = "paloma-linux"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false
description = "GTK4/Linux frontend: overlay UI, settings, hotkey portal, and tray"

[[bin]]
name = "paloma"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.12", default-features = false, features = [
    "tokio",
    "global_shortcuts",
] }
env_logger = { workspace = true }
futures = { workspace = true }
gtk4 = { version = "0.11.4", default-features = false, features = ["v4_22"] }
gtk4-layer-shell = "0.8.0"
ksni = { version = "0.3.5", default-features = false, features = ["tokio"] }
libadwaita = { version = "0.9.1", features = ["v1_9"] }
log = { workspace = true }
paloma-core = { workspace = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
uuid = { workspace = true }

[lints]
workspace = true
