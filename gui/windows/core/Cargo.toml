[package]
name = "paloma-windows-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false
description = "Windows core service: serves paloma-core over gRPC on a named pipe"

[[bin]]
name = "paloma-core"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
dashmap = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
paloma-binding-protocol = { workspace = true }
paloma-core = { workspace = true }
paloma-extension-protocol = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tonic = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
hyper-util = { version = "0.1.20", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
