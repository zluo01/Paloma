[workspace]
resolver = "3"
members = [
    "core",
    "extension-base",
    "extension-protocol",
    "ffi",
    "gui/linux",
    "plugins/extensions/internal",
    "plugins/extensions/shell",
    "plugins/providers/anthropic",
    "plugins/providers/openai",
    "provider-base",
    "provider-protocol",
    "uniffi-bindgen",
    "utils",
]
# skip the macos-only crates in bare cargo invocations
default-members = ["core", "gui/linux"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93.0"
license = "GPL-3.0-or-later"

[workspace.lints.clippy]
redundant_clone = "warn"
implicit_clone = "warn"

[workspace.dependencies]
async-trait = "0.1.89"
backon = "1.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dashmap = "6.2.1"
env_logger = "0.11.11"
eventsource-stream = "0.2.3"
futures = "0.3.32"
log = "0.4.33"
oauth2 = { version = "5.0.0", default-features = false }
paloma-core = { path = "core" }
paloma-extension-base = { path = "extension-base" }
paloma-extension-internal = { path = "plugins/extensions/internal" }
paloma-extension-protocol = { path = "extension-protocol" }
paloma-extension-shell = { path = "plugins/extensions/shell" }
paloma-provider-anthropic = { path = "plugins/providers/anthropic" }
paloma-provider-base = { path = "provider-base" }
paloma-provider-openai = { path = "plugins/providers/openai" }
paloma-provider-protocol = { path = "provider-protocol" }
paloma-utils = { path = "utils" }
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "form",
    "rustls",
    "http2",
    "stream",
] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false }
tokio-util = { version = "0.7.18", features = ["codec"] }
uniffi = "0.32.0"
uuid = { version = "1.23.4", default-features = false, features = ["v7", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
