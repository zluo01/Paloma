[package]
name = "scry-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[dependencies]
async-trait = { workspace = true }
ctor = { version = "1.0.9", default-features = false, features = ["proc_macro", "std"] }
dashmap = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
oauth2 = { workspace = true }
regex = "1.12.4"
reqwest = { workspace = true }
rmcp = { version = "2.1.0", default-features = false, features = [
    "client",
    "auth",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars = "1.2.1"
scry-extension-internal = { workspace = true }
scry-extension-protocol = { workspace = true }
scry-provider-anthropic = { workspace = true }
scry-provider-openai = { workspace = true }
scry-provider-protocol = { workspace = true }
scry-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "json"] }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "sync",
    "rt",
    "time",
    "macros",
    "process",
] }
tree-sitter = "0.26.10"
tree-sitter-bash = "0.25.1"
uuid = { workspace = true, features = ["v7", "std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

