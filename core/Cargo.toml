[package]
name = "scry-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[dependencies]
async-trait = "0.1.89"
backon = "1.6.0"
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
chrono = { workspace = true, features = ["serde"] }
dashmap = "6.2.1"
eventsource-stream = "0.2.3"
exmex = "0.21.0"
futures = { workspace = true }
ignore = "0.4.27"
log = { workspace = true }
mime_guess = "2.0.5"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
oauth2 = "5.0.0"
open = "5.3.6"
rayon = "1.12.0"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "form",
    "rustls",
    "http2",
    "stream",
] }
rmcp = { version = "2.1.0", default-features = false, features = [
    "client",
    "auth",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
sha1 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "json"] }
thiserror = "2.0.18"
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "sync",
    "rt",
    "time",
    "macros",
    "process",
] }
tree-sitter = "0.26.10"
tree-sitter-bash = "0.25.1"
url = "2.5.8"
uuid = { workspace = true, features = ["v7", "std"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-desktop-entry = "0.8.1"
wl-clipboard-rs = "0.9.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSEnumerator"] }
plist = "1.10.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "macros", "test-util", "time"] }
