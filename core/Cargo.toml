[package]
name = "paloma-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
async-trait = { workspace = true }
base64 = "0.23.1"
ctor = { version = "1.0.9", default-features = false, features = ["proc_macro", "std"] }
dashmap = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
oauth2 = { workspace = true }
paloma-extension-internal = { workspace = true }
paloma-extension-protocol = { workspace = true }
paloma-extension-shell = { workspace = true }
paloma-provider-anthropic = { workspace = true }
paloma-provider-openai = { workspace = true }
paloma-provider-protocol = { workspace = true }
paloma-utils = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmcp = { version = "3.1.3", default-features = false, features = [
    "client",
    "auth",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "json"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "sync",
    "rt",
    "time",
    "macros",
    "process",
] }
tokio-util = { workspace = true }
tree-sitter = "0.26.10"
tree-sitter-bash = "0.25.1"
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
