[package]
name = "scry-ffi"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

[lib]
# staticlib is what the Swift/Xcode side links; cdylib lets uniffi-bindgen
# run in library mode on the host during development.
crate-type = ["lib", "staticlib", "cdylib"]

# The swift bridge only exists for the macos frontend; on other platforms
# the crate builds empty (see the crate-level cfg in src/lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
chrono = { workspace = true }
env_logger = "0.11.11"
futures = { workspace = true }
log = { workspace = true }
scry-core = { path = "../core" }
thiserror = "2.0.18"
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
uniffi = { workspace = true }
uuid = { workspace = true, features = ["std"] }
