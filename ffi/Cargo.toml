[package]
name = "paloma-ffi"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false

[lib]
# staticlib is what the Swift/Xcode side links; cdylib is what the Windows host
# loads and what uniffi-bindgen reads in library mode.
crate-type = ["lib", "staticlib", "cdylib"]

# The bridge only exists for the macos and windows frontends; on other platforms
# the crate builds empty (see the crate-level cfg in src/lib.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
chrono = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
paloma-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
uniffi = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
